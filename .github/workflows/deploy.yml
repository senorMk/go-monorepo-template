name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/api/go.sum

      - name: Vet, build and test the API
        working-directory: apps/api
        run: |
          go vet ./...
          go build ./...
          go test ./...

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test-api
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve GHCR owner
        id: ghcr
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.ghcr.outputs.owner }}/APP_NAME-api:dev
            ghcr.io/${{ steps.ghcr.outputs.owner }}/APP_NAME-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=https://api.APP_DOMAIN
          tags: |
            ghcr.io/${{ steps.ghcr.outputs.owner }}/APP_NAME-web:dev
            ghcr.io/${{ steps.ghcr.outputs.owner }}/APP_NAME-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy via Coolify
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ]; then
            echo "::error::COOLIFY_WEBHOOK_URL secret is not set. Add it in GitHub Settings → Secrets and variables → Actions (value comes from Coolify → your resource → Webhooks)."
            exit 1
          fi
          args=()
          if [ -n "$COOLIFY_TOKEN" ]; then
            args+=(-H "Authorization: Bearer $COOLIFY_TOKEN")
          fi
          curl --fail --show-error --silent --location --request GET "$COOLIFY_WEBHOOK_URL" "${args[@]}"
